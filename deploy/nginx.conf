# Hang Guy — nginx site config (same-origin: static client + proxied socket.io)
#
# Install on the Proxmox box:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/hangguy
#   sudo ln -s /etc/nginx/sites-available/hangguy /etc/nginx/sites-enabled/hangguy
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace hangguy.example.com with your domain (or the LXC/VM IP for LAN-only).

server {
    listen 80;
    server_name hangguy.example.com;

    # --- Static client (Vite build output) ---
    # Copy client/dist here, or point root straight at the repo's client/dist.
    root /var/www/hangguy;
    index index.html;

    # SPA fallback: every unknown path serves index.html so client routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the fingerprinted assets Vite emits (safe — filenames change on rebuild).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- Socket.IO backend (the Node process on :3001) ---
    # This block is what makes WebSockets work. The Upgrade/Connection headers
    # are mandatory; without them socket.io degrades to HTTP long-polling or fails.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;   # keep idle websockets alive (24h)
        proxy_send_timeout 86400s;
    }
}
